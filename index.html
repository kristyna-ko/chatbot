<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Průvodce názory společnosti</title>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#eef2f7;
}

.container{
max-width:900px;
margin:0 auto;
padding:20px;
}

.chat{
height:75vh;
overflow-y:auto;
background:white;
padding:20px;
border-radius:15px;
box-shadow:0 2px 10px rgba(0,0,0,.1);
}

.message{
margin-bottom:15px;
padding:15px;
border-radius:12px;
max-width:80%;
line-height:1.6;
}

.bot{
background:#f1f5f9;
}

.user{
background:#1976d2;
color:white;
margin-left:auto;
}

.typing{
font-style:italic;
color:#666;
}

.options{
margin-top:15px;
}

.options button{
width:100%;
padding:12px;
margin-bottom:8px;
border:none;
border-radius:8px;
cursor:pointer;
font-weight:bold;
}

.a{
background:#0d47a1;
color:white;
}

.b{
background:#ef6c00;
color:white;
}

.n{
background:#eceff1;
}

.hidden{
display:none;
}

.result-wrapper{
margin-top:20px;
padding:20px;
background:white;
border-radius:12px;
}

.compass{
position:relative;
width:500px;
height:500px;
margin:30px auto;
background:#f3f3f3;
border:1px solid #ccc;
}

.axis-x{
position:absolute;
left:0;
top:50%;
width:100%;
height:2px;
background:black;
}

.axis-y{
position:absolute;
top:0;
left:50%;
width:2px;
height:100%;
background:black;
}

.axis-label{
position:absolute;
font-weight:bold;
font-size:20px;
}

.top-label{
top:10px;
left:50%;
transform:translateX(-50%);
}

.bottom-label{
bottom:10px;
left:50%;
transform:translateX(-50%);
}

.left-label{
left:10px;
top:50%;
transform:translateY(-50%);
}

.right-label{
right:10px;
top:50%;
transform:translateY(-50%);
}

.user-point{
position:absolute;
width:18px;
height:18px;
border-radius:50%;
background:red;
border:3px solid white;
box-shadow:0 0 10px rgba(0,0,0,.4);
}

.populism{
margin-top:40px;
}

.popbar{
position:relative;
height:30px;
border-radius:30px;
overflow:hidden;
background:
linear-gradient(
90deg,
#2ecc71 0%,
#8bc34a 25%,
#f1c40f 50%,
#f39c12 75%,
#e74c3c 100%
);
}

.popmarker{
position:absolute;
top:-5px;
width:5px;
height:40px;
background:black;
}

.profileText{
line-height:1.8;
font-size:17px;
margin-bottom:20px;
}

</style>

</head>
<body>

<div class="container">

<div class="chat" id="chat"></div>

<div class="options" id="options"></div>

</div>

<script>

const questions = [

{
intro:"Představ si, že ve městě není dost dostupných bytů.",
a:"Město by mělo investovat do stavby dostupných bytů.",
b:"Byty by měli stavět hlavně soukromí investoři.",
x:-2,
reactions:{
aStrong:"Města po celém světě hledají různé způsoby, jak zajistit dostupné bydlení pro své obyvatele.",
aSoft:"Otázka bydlení často souvisí s tím, jak velkou roli má mít město při řešení problémů.",
neutral:"Mnoho lidí vidí výhody i nevýhody obou přístupů.",
bSoft:"Někteří lidé věří, že větší prostor pro soukromé investory může přinést více nových bytů.",
bStrong:"Role soukromých investorů při rozvoji měst patří mezi často diskutovaná témata."
}
},

{
intro:"Veřejná doprava ovlivňuje každodenní život mnoha lidí.",
a:"Doprava by měla být levná nebo zdarma pro mladé.",
b:"Každý by měl platit podle toho, jak dopravu využívá.",
x:-2,
reactions:{
aStrong:"Některá města využívají levnější dopravu jako podporu mladých lidí.",
aSoft:"Cena dopravy může ovlivnit, jak často ji lidé využívají.",
neutral:"Financování veřejné dopravy není jednoduché téma.",
bSoft:"Platba podle využití je běžným principem u mnoha služeb.",
bStrong:"Názory na to, kdo má dopravu financovat, se často liší."
}
},

{
intro:"Podniky vytvářejí pracovní místa a služby.",
a:"Podnikatelé by měli mít co nejméně překážek.",
b:"Stát by měl podnikání více regulovat.",
x:2,
reactions:{
aStrong:"Pravidla a regulace mohou ovlivňovat rychlost rozvoje podnikání.",
aSoft:"Mnoho ekonomických debat se týká hledání rovnováhy mezi svobodou a pravidly.",
neutral:"Oba přístupy mají své výhody i nevýhody.",
bSoft:"Někteří lidé považují dohled za důležitou ochranu zákazníků.",
bStrong:"Otázka regulace podnikání je součástí debat ve většině zemí."
}
},

{
intro:"Město hospodaří s omezeným rozpočtem.",
a:"Je lepší hospodařit opatrně.",
b:"Je lepší více investovat do rozvoje.",
x:2,
reactions:{
aStrong:"Některá města dávají přednost finanční rezervě před většími investicemi.",
aSoft:"Rozhodování o veřejných penězích bývá složité.",
neutral:"Obě možnosti mohou být v různých situacích výhodné.",
bSoft:"Investice mohou přinést dlouhodobé zlepšení života obyvatel.",
bStrong:"Rozvoj měst bývá často spojen s vyššími výdaji."
}
},

{
intro:"Zdravotní péče je důležitá pro všechny.",
a:"Každý by měl mít podobně dostupnou péči.",
b:"Lidé by si měli více rozhodovat o péči sami.",
x:-2,
reactions:{
aStrong:"Dostupnost zdravotní péče je častým tématem veřejných debat.",
aSoft:"Otázka dostupnosti zdravotnictví se týká většiny lidí.",
neutral:"Mnoho zemí kombinuje oba přístupy.",
bSoft:"Někteří lidé dávají přednost větší možnosti vlastní volby.",
bStrong:"Různé státy řeší zdravotnictví různými způsoby."
}
},

{
intro:"Veřejné finance lze využít různými způsoby.",
a:"Peníze mají jít hlavně na služby.",
b:"Přednost má snižování dluhu.",
x:-2,
reactions:{
aStrong:"Rozdělování veřejných peněz patří k nejdůležitějš;

let current = -1;

let answers = [];

let leftRightScore = 0;
let progressiveScore = 0;
let populismScore = 0;
let populismQuestions = 0;

const chat = document.getElementById("chat");
const options = document.getElementById("options");

function addMessage(text,type){

const div=document.createElement("div");

div.className="message "+type;

div.innerHTML=text;

chat.appendChild(div);

chat.scrollTop=chat.scrollHeight;
}

function typingIndicator(){

const div=document.createElement("div");

div.className="message bot typing";

div.id="typing";

div.innerHTML="🤖 píše...";

chat.appendChild(div);

chat.scrollTop=chat.scrollHeight;
}

function removeTyping(){

const t=document.getElementById("typing");

if(t) t.remove();

}

function typeBotMessage(text,callback){

typingIndicator();

setTimeout(()=>{

removeTyping();

const bubble=document.createElement("div");

bubble.className="message bot";

chat.appendChild(bubble);

let i=0;

const interval=setInterval(()=>{

bubble.innerHTML=text.substring(0,i);

i++;

chat.scrollTop=chat.scrollHeight;

if(i>text.length){

clearInterval(interval);

if(callback) callback();

}

},15);

},800);
}

function askQuestion(){

current++;

if(current>=questions.length){

showResult();

return;

}

const q=questions[current];

typeBotMessage(`
<b>Otázka ${current+1}</b><br><br>
${q.intro}<br><br>
<b>A:</b> ${q.a}<br><br>
<b>B:</b> ${q.b}
`,()=>{

options.innerHTML=
`
<button class="a" onclick="answer('aStrong','Určitě A')">Určitě A</button>

<button class="a" onclick="answer('aSoft','Spíše A')">Spíše A</button>

<button class="n" onclick="answer('neutral','Neutrální')">Neutrální</button>

<button class="b" onclick="answer('bSoft','Spíše B')">Spíše B</button>

<button class="b" onclick="answer('bStrong','Určitě B')">Určitě B</button>
`;

});

}

function answer(type,text){

const q = questions[current];

let value = 0;

if(type==="aStrong") value = -2;
if(type==="aSoft") value = -1;
if(type==="neutral") value = 0;
if(type==="bSoft") value = 1;
if(type==="bStrong") value = 2;

answers.push(value);

if(q.x){

leftRightScore += value * q.x;

}

if(q.y){

progressiveScore += value * q.y;

}

if(q.pop){

populismQuestions++;

if(value > 0){

populismScore += value;

}

}

addMessage(text,"user");

options.innerHTML="";

typeBotMessage(q.reactions[type],()=>{

setTimeout(()=>{

askQuestion();

},700);

});

}

const q=questions[current];

addMessage(text,"user");

options.innerHTML="";

typeBotMessage(q.reactions[type],()=>{

setTimeout(()=>{

askQuestion();

},700);

});

}

function renderResults(profile,x,y,pop){

const center = 250;

const pointX = center + (x*2);
const pointY = center - (y*2);

return `

<div class="result-wrapper">

<div class="profileText">

${profile}

</div>

<h2>📍 Tvoje pozice na mapě názorů</h2>

<div class="compass">

<div class="axis-x"></div>
<div class="axis-y"></div>

<div class="axis-label top-label">
PROGRESIVNÍ
</div>

<div class="axis-label bottom-label">
KONZERVATIVNÍ
</div>

<div class="axis-label left-label">
LEVICE
</div>

<div class="axis-label right-label">
PRAVICE
</div>

<div
class="user-point"
style="
left:${pointX}px;
top:${pointY}px;
">
</div>

</div>

<div class="populism">

<h2>
🧠 Náchylnost k populismu
</h2>

<div class="popbar">

<div
class="popmarker"
style="left:${pop}%;">
</div>

</div>

<br>

<strong>${pop}%</strong>

</div>

</div>

`;

}

function showResult(){

options.style.display="none";

let x = Math.max(
-100,
Math.min(100,leftRightScore*3)
);

let y = Math.max(
-100,
Math.min(100,progressiveScore*3)
);

let pop = 0;

if(populismQuestions>0){

pop = Math.round(
(populismScore/(populismQuestions*2))*100
);

}

let ekonomika = "";

if(x < -20){

ekonomika =
"Ve veřejných otázkách se spíše přikláníš k větší solidaritě a roli veřejných institucí.";

}
else if(x > 20){

ekonomika =
"Ve veřejných otázkách více zdůrazňuješ osobní odpovědnost a samostatnost jednotlivce.";

}
else{

ekonomika =
"V ekonomických otázkách se pohybuješ blízko středu a často hledáš vyvážená řešení.";

}

let spolecnost = "";

if(y > 20){

spolecnost =
"Ve společenských otázkách jsi otevřenější změnám, novým technologiím a novým přístupům.";

}
else if(y < -20){

spolecnost =
"Ve společenských otázkách kladeš větší důraz na tradice, stabilitu a postupnější změny.";

}
else{

spolecnost =
"Ve společenských otázkách spojuješ respekt k tradicím s otevřeností novým myšlenkám.";

}

let kritika = "";

if(pop < 30){

kritika =
"Tvoje odpovědi naznačují vysokou opatrnost vůči jednoduchým vysvětlením složitých problémů.";

}
else if(pop < 60){

kritika =
"Většinu informací hodnotíš kriticky, ale některé jednodušší argumenty tě mohou oslovit.";

}
else{

kritika =
"Častěji dáváš důvěru jednoduchým vysvětlením složitějších problémů.";

}

const profile = `

<h2>🎯 Tvůj profil</h2>

<p>

${ekonomika}

<br><br>

${spolecnost}

<br><br>

${kritika}

<br><br>

Výsledek neříká, koho bys měl volit.
Ukazuje pouze postoje, které se nejčastěji objevily ve tvých odpovědích.

</p>

`;

typeBotMessage(

renderResults(
profile,
x,
y,
pop
)

);


<hr>

<h3>📊 Souřadnice</h3>

Levice ↔ Pravice: <b>${x}</b>

<br><br>

Konzervativní ↔ Progresivní: <b>${y}</b>

<br><br>

🧠 Populismus: <b>${pop}%</b>

`
);

}

typeBotMessage(`
✅ Děkuji za odpovědi.
`);
}

window.onload=()=>{

typeBotMessage(`
Ahoj! 👋

Jsem průvodce, který ti pomůže zjistit, jak přemýšlíš o různých tématech ve společnosti.

Nejde o test správných odpovědí a nebudu ti doporučovat žádnou politickou stranu.

Po každé odpovědi si krátce popovídáme a potom dostaneš další otázku.

Jsi připraven?
`,()=>{

askQuestion();

});

};

</script>

</body>
</html>
