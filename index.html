let current = -1;

let answers = [];

let leftRightScore = 0;
let progressiveScore = 0;
let populismScore = 0;
let populismQuestions = 0;

const chat = document.getElementById("chat");
const options = document.getElementById("options");

function addMessage(text,type){

const div=document.createElement("div");

div.className="message "+type;

div.innerHTML=text;

chat.appendChild(div);

chat.scrollTop=chat.scrollHeight;
}

function typingIndicator(){

const div=document.createElement("div");

div.className="message bot typing";

div.id="typing";

div.innerHTML="🤖 píše...";

chat.appendChild(div);

chat.scrollTop=chat.scrollHeight;
}

function removeTyping(){

const t=document.getElementById("typing");

if(t) t.remove();

}

function typeBotMessage(text,callback){

typingIndicator();

setTimeout(()=>{

removeTyping();

const bubble=document.createElement("div");

bubble.className="message bot";

chat.appendChild(bubble);

let i=0;

const interval=setInterval(()=>{

bubble.innerHTML=text.substring(0,i);

i++;

chat.scrollTop=chat.scrollHeight;

if(i>text.length){

clearInterval(interval);

if(callback) callback();

}

},15);

},800);
}

function askQuestion(){

current++;

if(current>=questions.length){

showResult();

return;

}

const q=questions[current];

typeBotMessage(`
<b>Otázka ${current+1}</b><br><br>
${q.intro}<br><br>
<b>A:</b> ${q.a}<br><br>
<b>B:</b> ${q.b}
`,()=>{

options.innerHTML=
`
<button class="a" onclick="answer('aStrong','Určitě A')">Určitě A</button>

<button class="a" onclick="answer('aSoft','Spíše A')">Spíše A</button>

<button class="n" onclick="answer('neutral','Neutrální')">Neutrální</button>

<button class="b" onclick="answer('bSoft','Spíše B')">Spíše B</button>

<button class="b" onclick="answer('bStrong','Určitě B')">Určitě B</button>
`;

});

}

function answer(type,text){

const q = questions[current];

let value = 0;

if(type==="aStrong") value = -2;
if(type==="aSoft") value = -1;
if(type==="neutral") value = 0;
if(type==="bSoft") value = 1;
if(type==="bStrong") value = 2;

answers.push(value);

if(q.x){
leftRightScore += value * q.x;
}

if(q.y){
progressiveScore += value * q.y;
}

if(q.pop){

populismQuestions++;

if(value>0){
populismScore += value;
}

}

addMessage(text,"user");

options.innerHTML="";

typeBotMessage(q.reactions[type],()=>{

setTimeout(()=>{

askQuestion();

},700);

});

}

function showResult(){

let x = Math.max(
-100,
Math.min(
100,
leftRightScore * 3
)
);

let y = Math.max(
-100,
Math.min(
100,
progressiveScore * 3
)
);

let pop = 0;

if(populismQuestions>0){

pop = Math.round(
(populismScore / (populismQuestions*2))
* 100
);

}

let ekonomika="";

if(x < -20){

ekonomika =
"Ve veřejných otázkách se spíše přikláníš k větší solidaritě a podpoře veřejných služeb.";

}
else if(x > 20){

ekonomika =
"Ve veřejných otázkách více zdůrazňuješ osobní odpovědnost a samostatnost jednotlivce.";

}

"V ekonomických otázkách se pohybuješ blízko středu a často hledáš vyvážená řešení.";

spolecnost =

else{

spolecnost =

"Častěji dáváš přednost jednodušším vysvětlením složitých problémů a vyplatí se více pracovat s různými zdroji informací.";

}

const center = 250;

const pointX = center + (x * 2);

const pointY = center - (y * 2);

typeBotMessage(`
